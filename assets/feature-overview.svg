    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3faf8"/></linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#back)"/>
  <circle cx="1140" cy="20" r="160" fill="#244a50" opacity=".6"/>
  <circle cx="35" cy="462" r="120" fill="#21555a" opacity=".4"/>
  <g font-family="Segoe UI,Microsoft YaHei UI,Microsoft YaHei,sans-serif">
